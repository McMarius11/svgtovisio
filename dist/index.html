<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG to Visio Converter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }
        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #d4a574, #e8c9a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        header p { color: #888; font-size: 0.95rem; }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 1rem;
        }

        .drop-zone {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #16213e;
            margin-bottom: 1.5rem;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #d4a574;
            background: #1a2744;
        }
        .drop-zone .icon { font-size: 3rem; margin-bottom: 1rem; }
        .drop-zone p { color: #aaa; margin: 0.3rem 0; }
        .drop-zone .browse { color: #d4a574; text-decoration: underline; cursor: pointer; }

        .or-divider {
            text-align: center;
            color: #555;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .paste-area {
            width: 100%;
            min-height: 150px;
            background: #0f1629;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ccc;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            padding: 1rem;
            resize: vertical;
            margin-bottom: 1rem;
        }
        .paste-area:focus { outline: none; border-color: #d4a574; }

        .btn {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4a574, #c9956a);
            color: #1a1a2e;
            font-weight: 600;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(212,165,116,0.3); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .actions {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .preview-section {
            background: #16213e;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: none;
        }
        .preview-section h3 { margin-bottom: 1rem; color: #d4a574; }
        .preview-container {
            background: white;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            overflow: auto;
            max-height: 500px;

        .preview-container svg { max-width: 100%; height: auto; }

            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        .stat-badge {
            background: #1a2744;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .stat-badge span { color: #d4a574; font-weight: 600; }

            background: #0f1629;
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            margin-bottom: 1rem;

<body>
    <header>
        <h1>SVG &amp; Draw.io to Visio Converter</h1>
        <p>Convert SVG diagrams and Draw.io files to editable Visio (.vsdx) files</p>
    </header>

    <div class="container">
        <div class="drop-zone" id="dropZone">
            <div class="icon">&#128196;</div>
            <p>Drag &amp; drop an SVG or .drawio file here</p>
            <p class="browse" id="browseBtn">or click to browse</p>
        </div>

        <div class="or-divider">- or paste SVG / Draw.io XML code below -</div>

        <textarea class="paste-area" id="svgInput" placeholder="Paste your SVG or Draw.io XML here...&#10;&#10;SVG: <svg xmlns=&quot;...&quot; viewBox=&quot;0 0 800 600&quot;>...</svg>&#10;Draw.io: <mxfile>...<mxGraphModel>...</mxGraphModel>...</mxfile>"></textarea>

        <div class="actions">
            <button class="btn btn-primary" id="convertBtn" disabled>Convert to .vsdx</button>
            <span id="statusText" style="color:#888; font-size:0.9rem;"></span>
        </div>

        <div class="log" id="log"></div>

        <div class="preview-section" id="previewSection">
            <h3>SVG Preview</h3>
            <div class="preview-container" id="previewContainer"></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".svg,.drawio,.xml,image/svg+xml">

    <script>/* svg-parser.js */
/**
 * SVG Parser - Extracts shapes, connectors, and text from Claude-generated SVGs.
 *
 * Claude typically generates SVGs with:
 * - <rect> for boxes/cards
 * - <circle>, <ellipse> for circles
 * - <line>, <polyline>, <path> for arrows/connectors
 * - <polygon> for diamonds/triangles
 * - <text> for labels
 * - <marker> definitions for arrowheads
 * - <g> groups combining shapes with their labels
 */

class SvgParser {
    constructor(svgString) {
        this.svgString = svgString;
        this.parser = new DOMParser();
        this.doc = null;
        this.svgEl = null;
        this.viewBox = { x: 0, y: 0, width: 800, height: 600 };
        this.shapes = [];
        this.connectors = [];
        this.texts = [];
        this.defs = {};
    }

    parse() {
        this.doc = this.parser.parseFromString(this.svgString, 'image/svg+xml');
        const errorNode = this.doc.querySelector('parsererror');
        if (errorNode) {
            throw new Error('Invalid SVG: ' + errorNode.textContent.slice(0, 200));
        }

        this.svgEl = this.doc.querySelector('svg');
        if (!this.svgEl) {
            throw new Error('No <svg> element found');
        }

        this._parseViewBox();
        this._parseDefs();
        this._parseElements(this.svgEl, null);
        this._associateTextsWithShapes();
        this._detectConnectors();

        return {
            viewBox: this.viewBox,
            shapes: this.shapes,
            connectors: this.connectors,
            texts: this.texts
        };
    }

    _parseViewBox() {
        const vb = this.svgEl.getAttribute('viewBox');
        if (vb) {
            const parts = vb.split(/[\s,]+/).map(Number);
            if (parts.length === 4) {
                this.viewBox = { x: parts[0], y: parts[1], width: parts[2], height: parts[3] };
            }
        } else {
            const w = this.svgEl.getAttribute('width');
            const h = this.svgEl.getAttribute('height');
            if (w && h) {
                this.viewBox.width = parseFloat(w);
                this.viewBox.height = parseFloat(h);
            }
        }
    }

    _parseDefs() {
        const defs = this.svgEl.querySelector('defs');
        if (!defs) return;

        // Parse markers (arrowheads)
        defs.querySelectorAll('marker').forEach(marker => {
            this.defs[marker.id] = {
                type: 'marker',
                id: marker.id
            };
        });
    }

    _parseElements(parent, groupTransform) {
        for (const el of parent.children) {
            const tag = el.tagName.toLowerCase();

            if (tag === 'defs' || tag === 'style' || tag === 'title' || tag === 'desc') continue;

            if (tag === 'g') {
                const transform = this._combineTransform(groupTransform, el.getAttribute('transform'));
                this._parseElements(el, transform);
                continue;
            }

            const style = this._extractStyle(el);

            switch (tag) {
                case 'rect':
                    this._parseRect(el, style, groupTransform);
                    break;
                case 'circle':
                    this._parseCircle(el, style, groupTransform);
                    break;
                case 'ellipse':
                    this._parseEllipse(el, style, groupTransform);
                    break;
                case 'polygon':
                    this._parsePolygon(el, style, groupTransform);
                    break;
                case 'line':
                    this._parseLine(el, style, groupTransform);
                    break;
                case 'polyline':
                    this._parsePolyline(el, style, groupTransform);
                    break;
                case 'path':
                    this._parsePath(el, style, groupTransform);
                    break;
                case 'text':
                    this._parseText(el, style, groupTransform);
                    break;
            }
        }
    }

    _extractStyle(el) {
        const style = {
            fill: 'none',
            fillOpacity: 1,
            stroke: 'none',
            strokeWidth: 1,
            strokeDasharray: null,
            fontSize: 14,
            fontFamily: 'Calibri',
            fontWeight: 'normal',
            textAnchor: 'middle',
            opacity: 1,
            rx: 0,
            ry: 0
        };

        // Read from attributes
        const fillAttr = el.getAttribute('fill');
        if (fillAttr) style.fill = fillAttr;

        const strokeAttr = el.getAttribute('stroke');
        if (strokeAttr) style.stroke = strokeAttr;

        const strokeWidthAttr = el.getAttribute('stroke-width');
        if (strokeWidthAttr) style.strokeWidth = parseFloat(strokeWidthAttr);

        const strokeDashAttr = el.getAttribute('stroke-dasharray');
        if (strokeDashAttr) style.strokeDasharray = strokeDashAttr;

        const opacityAttr = el.getAttribute('opacity');
        if (opacityAttr) style.opacity = parseFloat(opacityAttr);

        const fillOpacityAttr = el.getAttribute('fill-opacity');
        if (fillOpacityAttr) style.fillOpacity = parseFloat(fillOpacityAttr);

        const fontSizeAttr = el.getAttribute('font-size');
        if (fontSizeAttr) style.fontSize = parseFloat(fontSizeAttr);

        const fontFamilyAttr = el.getAttribute('font-family');
        if (fontFamilyAttr) style.fontFamily = fontFamilyAttr;

        const fontWeightAttr = el.getAttribute('font-weight');
        if (fontWeightAttr) style.fontWeight = fontWeightAttr;

        const textAnchorAttr = el.getAttribute('text-anchor');
        if (textAnchorAttr) style.textAnchor = textAnchorAttr;

        const rxAttr = el.getAttribute('rx');
        if (rxAttr) style.rx = parseFloat(rxAttr);

        const ryAttr = el.getAttribute('ry');
        if (ryAttr) style.ry = parseFloat(ryAttr);

        // Override with inline style attribute
        const inlineStyle = el.getAttribute('style');
        if (inlineStyle) {
            const props = inlineStyle.split(';');
            for (const prop of props) {
                const [key, val] = prop.split(':').map(s => s.trim());
                if (!key || !val) continue;
                switch (key) {
                    case 'fill': style.fill = val; break;
                    case 'stroke': style.stroke = val; break;
                    case 'stroke-width': style.strokeWidth = parseFloat(val); break;
                    case 'stroke-dasharray': style.strokeDasharray = val; break;
                    case 'opacity': style.opacity = parseFloat(val); break;
                    case 'fill-opacity': style.fillOpacity = parseFloat(val); break;
                    case 'font-size': style.fontSize = parseFloat(val); break;
                    case 'font-family': style.fontFamily = val; break;
                    case 'font-weight': style.fontWeight = val; break;
                    case 'text-anchor': style.textAnchor = val; break;
                }
            }
        }

        return style;
    }

    _combineTransform(parent, child) {
        if (!parent && !child) return null;
        if (!child) return parent;
        if (!parent) return child;
        return parent + ' ' + child;
    }

    _applyTransform(x, y, transform) {
        if (!transform) return { x, y };

        const translateMatch = transform.match(/translate\(\s*([^,\s]+)[\s,]*([^)]*)\)/);
        if (translateMatch) {
            x += parseFloat(translateMatch[1]);
            y += parseFloat(translateMatch[2] || 0);
        }

        return { x, y };
    }

    _parseRect(el, style, transform) {
        let x = parseFloat(el.getAttribute('x') || 0);
        let y = parseFloat(el.getAttribute('y') || 0);
        const w = parseFloat(el.getAttribute('width') || 0);
        const h = parseFloat(el.getAttribute('height') || 0);

        if (w === 0 || h === 0) return;

        const pos = this._applyTransform(x, y, transform);

        this.shapes.push({
            type: 'rect',
            x: pos.x,
            y: pos.y,
            width: w,
            height: h,
            style,
            id: el.id || null,
            text: null
        });
    }

    _parseCircle(el, style, transform) {
        let cx = parseFloat(el.getAttribute('cx') || 0);
        let cy = parseFloat(el.getAttribute('cy') || 0);
        const r = parseFloat(el.getAttribute('r') || 0);

        if (r === 0) return;

        const pos = this._applyTransform(cx, cy, transform);

        this.shapes.push({
            type: 'circle',
            x: pos.x - r,
            y: pos.y - r,
            width: r * 2,
            height: r * 2,
            cx: pos.x,
            cy: pos.y,
            r,
            style,
            id: el.id || null,
            text: null
        });
    }

    _parseEllipse(el, style, transform) {
        let cx = parseFloat(el.getAttribute('cx') || 0);
        let cy = parseFloat(el.getAttribute('cy') || 0);
        const rx = parseFloat(el.getAttribute('rx') || 0);
        const ry = parseFloat(el.getAttribute('ry') || 0);

        if (rx === 0 || ry === 0) return;

        const pos = this._applyTransform(cx, cy, transform);

        this.shapes.push({
            type: 'ellipse',
            x: pos.x - rx,
            y: pos.y - ry,
            width: rx * 2,
            height: ry * 2,
            style,
            id: el.id || null,
            text: null
        });
    }

    _parsePolygon(el, style, transform) {
        const pointsStr = el.getAttribute('points');
        if (!pointsStr) return;

        const points = this._parsePointsString(pointsStr);
        if (points.length < 3) return;

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const p of points) {
            const tp = this._applyTransform(p.x, p.y, transform);
            minX = Math.min(minX, tp.x);
            minY = Math.min(minY, tp.y);
            maxX = Math.max(maxX, tp.x);
            maxY = Math.max(maxY, tp.y);
        }

        // Detect diamond shape (4 points forming a rhombus)
        const isDiamond = points.length === 4 && this._isDiamondShape(points);

        this.shapes.push({
            type: isDiamond ? 'diamond' : 'polygon',
            x: minX,
            y: minY,
            width: maxX - minX,
            height: maxY - minY,
            points: points.map(p => this._applyTransform(p.x, p.y, transform)),
            style,
            id: el.id || null,
            text: null
        });
    }

    _isDiamondShape(points) {
        if (points.length !== 4) return false;
        const cx = points.reduce((s, p) => s + p.x, 0) / 4;
        const cy = points.reduce((s, p) => s + p.y, 0) / 4;

        // Check if points are roughly at top, right, bottom, left of center
        let hasTop = false, hasRight = false, hasBottom = false, hasLeft = false;
        const tolerance = 5;
        for (const p of points) {
            if (Math.abs(p.x - cx) < tolerance && p.y < cy) hasTop = true;
            if (Math.abs(p.x - cx) < tolerance && p.y > cy) hasBottom = true;
            if (p.x > cx && Math.abs(p.y - cy) < tolerance) hasRight = true;
            if (p.x < cx && Math.abs(p.y - cy) < tolerance) hasLeft = true;
        }
        return hasTop && hasRight && hasBottom && hasLeft;
    }

    _parseLine(el, style, transform) {
        let x1 = parseFloat(el.getAttribute('x1') || 0);
        let y1 = parseFloat(el.getAttribute('y1') || 0);
        let x2 = parseFloat(el.getAttribute('x2') || 0);
        let y2 = parseFloat(el.getAttribute('y2') || 0);

        const p1 = this._applyTransform(x1, y1, transform);
        const p2 = this._applyTransform(x2, y2, transform);

        const hasArrow = this._hasArrowMarker(el);

        this.connectors.push({
            type: 'line',
            points: [p1, p2],
            hasArrow,
            style,
            id: el.id || null,
            text: null
        });
    }

    _parsePolyline(el, style, transform) {
        const pointsStr = el.getAttribute('points');
        if (!pointsStr) return;

        const points = this._parsePointsString(pointsStr).map(p =>
            this._applyTransform(p.x, p.y, transform)
        );

        if (points.length < 2) return;

        const hasArrow = this._hasArrowMarker(el);

        this.connectors.push({
            type: 'polyline',
            points,
            hasArrow,
            style,
            id: el.id || null,
            text: null
        });
    }

    _parsePath(el, style, transform) {
        const d = el.getAttribute('d');
        if (!d) return;

        const hasArrow = this._hasArrowMarker(el);
        const points = this._pathToPoints(d, transform);

        if (points.length < 2) return;

        // Determine if this is a connector (line-like) or a filled shape
        const isFilled = style.fill !== 'none' && style.fill !== 'transparent' &&
                         style.fill !== '' && style.fill !== undefined;
        const isClosed = d.toLowerCase().includes('z');
        const isLikelyConnector = !isFilled || hasArrow ||
            (style.stroke !== 'none' && !isClosed);

        if (isLikelyConnector && !isClosed) {
            this.connectors.push({
                type: 'path',
                points,
                hasArrow,
                style,
                d,
                id: el.id || null,
                text: null
            });
        } else if (isClosed && isFilled) {
            // Treat as a shape
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const p of points) {
                minX = Math.min(minX, p.x);
                minY = Math.min(minY, p.y);
                maxX = Math.max(maxX, p.x);
                maxY = Math.max(maxY, p.y);
            }
            this.shapes.push({
                type: 'path-shape',
                x: minX,
                y: minY,
                width: maxX - minX,
                height: maxY - minY,
                points,
                style,
                d,
                id: el.id || null,
                text: null
            });
        } else {
            // Default to connector
            this.connectors.push({
                type: 'path',
                points,
                hasArrow,
                style,
                d,
                id: el.id || null,
                text: null
            });
        }
    }

    _parseText(el, style, transform) {
        let x = parseFloat(el.getAttribute('x') || 0);
        let y = parseFloat(el.getAttribute('y') || 0);

        const pos = this._applyTransform(x, y, transform);

        // Collect text from child <tspan> elements or direct text
        let textContent = '';
        const tspans = el.querySelectorAll('tspan');
        if (tspans.length > 0) {
            const lines = [];
            tspans.forEach(ts => {
                lines.push(ts.textContent.trim());
            });
            textContent = lines.join('\n');
        } else {
            textContent = el.textContent.trim();
        }

        if (!textContent) return;

        // Read font styles from text element specifically
        const fontSizeAttr = el.getAttribute('font-size');
        if (fontSizeAttr) style.fontSize = parseFloat(fontSizeAttr);

        const fontWeightAttr = el.getAttribute('font-weight');
        if (fontWeightAttr) style.fontWeight = fontWeightAttr;

        const fillAttr = el.getAttribute('fill');
        if (fillAttr) style.textColor = fillAttr;

        this.texts.push({
            x: pos.x,
            y: pos.y,
            text: textContent,
            style,
            id: el.id || null
        });
    }

    _hasArrowMarker(el) {
        const markerEnd = el.getAttribute('marker-end');
        const markerStart = el.getAttribute('marker-start');
        return !!(markerEnd || markerStart);
    }

    _parsePointsString(str) {
        const nums = str.trim().split(/[\s,]+/).map(Number);
        const points = [];
        for (let i = 0; i < nums.length - 1; i += 2) {
            if (!isNaN(nums[i]) && !isNaN(nums[i + 1])) {
                points.push({ x: nums[i], y: nums[i + 1] });
            }
        }
        return points;
    }

    _pathToPoints(d, transform) {
        const points = [];
        let curX = 0, curY = 0;
        let startX = 0, startY = 0;

        // Tokenize path data
        const tokens = d.match(/[a-zA-Z][^a-zA-Z]*/g) || [];

        for (const token of tokens) {
            const cmd = token[0];
            const nums = (token.slice(1).match(/-?\d+\.?\d*(?:e[+-]?\d+)?/gi) || []).map(Number);

            switch (cmd) {
                case 'M':
                    for (let i = 0; i < nums.length; i += 2) {
                        curX = nums[i]; curY = nums[i + 1];
                        startX = curX; startY = curY;
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'm':
                    for (let i = 0; i < nums.length; i += 2) {
                        curX += nums[i]; curY += nums[i + 1];
                        if (i === 0) { startX = curX; startY = curY; }
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'L':
                    for (let i = 0; i < nums.length; i += 2) {
                        curX = nums[i]; curY = nums[i + 1];
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'l':
                    for (let i = 0; i < nums.length; i += 2) {
                        curX += nums[i]; curY += nums[i + 1];
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'H':
                    for (const n of nums) {
                        curX = n;
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'h':
                    for (const n of nums) {
                        curX += n;
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'V':
                    for (const n of nums) {
                        curY = n;
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'v':
                    for (const n of nums) {
                        curY += n;
                        const p = this._applyTransform(curX, curY, transform);
                        points.push(p);
                    }
                    break;
                case 'C':
                    // Cubic bezier - take endpoint
                    for (let i = 0; i < nums.length; i += 6) {
                        if (i + 5 < nums.length) {
                            // Add control points for curve approximation
                            const midX = (curX + nums[i + 4]) / 2;
                            const midY = (curY + nums[i + 5]) / 2;
                            const mp = this._applyTransform(midX, midY, transform);
                            points.push(mp);
                            curX = nums[i + 4]; curY = nums[i + 5];
                            const p = this._applyTransform(curX, curY, transform);
                            points.push(p);
                        }
                    }
                    break;
                case 'c':
                    for (let i = 0; i < nums.length; i += 6) {
                        if (i + 5 < nums.length) {
                            const midX = curX + nums[i + 4] / 2;
                            const midY = curY + nums[i + 5] / 2;
                            const mp = this._applyTransform(midX, midY, transform);
                            points.push(mp);
                            curX += nums[i + 4]; curY += nums[i + 5];
                            const p = this._applyTransform(curX, curY, transform);
                            points.push(p);
                        }
                    }
                    break;
                case 'Q':
                    for (let i = 0; i < nums.length; i += 4) {
                        if (i + 3 < nums.length) {
                            curX = nums[i + 2]; curY = nums[i + 3];
                            const p = this._applyTransform(curX, curY, transform);
                            points.push(p);
                        }
                    }
                    break;
                case 'q':
                    for (let i = 0; i < nums.length; i += 4) {
                        if (i + 3 < nums.length) {
                            curX += nums[i + 2]; curY += nums[i + 3];
                            const p = this._applyTransform(curX, curY, transform);
                            points.push(p);
                        }
                    }
                    break;
                case 'A': case 'a':
                    // Arc - just take the endpoint
                    for (let i = 0; i < nums.length; i += 7) {
                        if (i + 6 < nums.length) {
                            if (cmd === 'a') {
                                curX += nums[i + 5]; curY += nums[i + 6];
                            } else {
                                curX = nums[i + 5]; curY = nums[i + 6];
                            }
                            const p = this._applyTransform(curX, curY, transform);
                            points.push(p);
                        }
                    }
                    break;
                case 'Z': case 'z':
                    curX = startX; curY = startY;
                    break;
            }
        }

        return points;
    }

    _associateTextsWithShapes() {
        // Try to associate each text with the nearest shape that contains it
        for (const text of this.texts) {
            let bestShape = null;
            let bestDist = Infinity;

            for (const shape of this.shapes) {
                const cx = shape.x + shape.width / 2;
                const cy = shape.y + shape.height / 2;

                // Check if text is inside or near the shape
                const inside = text.x >= shape.x - 10 && text.x <= shape.x + shape.width + 10 &&
                               text.y >= shape.y - 10 && text.y <= shape.y + shape.height + 10;

                if (inside) {
                    const dist = Math.hypot(text.x - cx, text.y - cy);
                    if (dist < bestDist) {
                        bestDist = dist;
                        bestShape = shape;
                    }
                }
            }

            if (bestShape) {
                // Append text if shape already has text
                if (bestShape.text) {
                    bestShape.text += '\n' + text.text;
                } else {
                    bestShape.text = text.text;
                }
                bestShape.textStyle = text.style;
                text._associated = true;
            }
        }

        // Keep unassociated texts as standalone text shapes
        this.texts = this.texts.filter(t => !t._associated);
    }

    _detectConnectors() {
        // Try to detect which shapes connectors connect to
        for (const conn of this.connectors) {
            if (conn.points.length < 2) continue;

            const startPt = conn.points[0];
            const endPt = conn.points[conn.points.length - 1];

            conn.fromShape = this._findNearestShape(startPt);
            conn.toShape = this._findNearestShape(endPt);
        }
    }

    _findNearestShape(point) {
        let best = null;
        let bestDist = 30; // Max distance threshold

        for (let i = 0; i < this.shapes.length; i++) {
            const shape = this.shapes[i];
            const cx = shape.x + shape.width / 2;
            const cy = shape.y + shape.height / 2;

            // Distance to shape edge
            const dx = Math.max(0, Math.abs(point.x - cx) - shape.width / 2);
            const dy = Math.max(0, Math.abs(point.y - cy) - shape.height / 2);
            const dist = Math.hypot(dx, dy);

            if (dist < bestDist) {
                bestDist = dist;
                best = i;
            }
        }

        return best;
    }

    getStats() {
        return {
            shapes: this.shapes.length,
            connectors: this.connectors.length,
            texts: this.texts.length,
            viewBox: this.viewBox
        };
    }
}

    <script>/* drawio-parser.js */
/**
 * Draw.io Parser - Extracts shapes, connectors, and text from Draw.io XML files.
 *
 * Draw.io uses mxGraphModel with mxCell elements:
 * - vertex="1" cells are shapes (with mxGeometry for position/size)
 * - edge="1" cells are connectors (with source/target references)
 * - Style is a semicolon-separated key=value string
 *
 * Output format matches SvgParser for compatibility with VsdxBuilder.
 */

class DrawioParser {
    constructor(xmlString) {
        this.xmlString = xmlString;
        this.parser = new DOMParser();
        this.viewBox = { x: 0, y: 0, width: 800, height: 600 };
        this.shapes = [];
        this.connectors = [];
        this.texts = [];

        // Maps Draw.io cell IDs to shape indices in this.shapes
        this.cellIdToShapeIndex = {};
    }

    parse() {
        let xmlContent = this.xmlString;

        // Handle <mxfile> wrapper — may contain compressed or raw <mxGraphModel>
        const doc = this.parser.parseFromString(xmlContent, 'text/xml');
        const errorNode = doc.querySelector('parsererror');
        if (errorNode) {
            throw new Error('Invalid XML: ' + errorNode.textContent.slice(0, 200));
        }

        // Find the mxGraphModel — could be root or inside <diagram>
        let graphModel = doc.querySelector('mxGraphModel');

        if (!graphModel) {
            // Check if diagram content is compressed (base64+deflate)
            const diagramEl = doc.querySelector('diagram');
            if (diagramEl) {
                const compressed = diagramEl.textContent.trim();
                if (compressed && !compressed.includes('<')) {
                    const decompressed = this._decompress(compressed);
                    const innerDoc = this.parser.parseFromString(decompressed, 'text/xml');
                    graphModel = innerDoc.querySelector('mxGraphModel');
                }
            }
        }

        if (!graphModel) {
            throw new Error('No <mxGraphModel> found in Draw.io file');
        }

        this._parseGraphModel(graphModel);

        return {
            viewBox: this.viewBox,
            shapes: this.shapes,
            connectors: this.connectors,
            texts: this.texts
        };
    }

    getStats() {
        return {
            shapes: this.shapes.length,
            connectors: this.connectors.length,
            texts: this.texts.length,
            viewBox: this.viewBox
        };
    }

    _decompress(data) {
        // Draw.io compressed format: base64 → inflate → URI decode
        const binary = atob(data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        // Use pako for decompression (included via CDN)
        if (typeof pako === 'undefined') {
            throw new Error('pako library required for compressed Draw.io files. Include pako via CDN.');
        }

        const inflated = pako.inflateRaw(bytes, { to: 'string' });
        return decodeURIComponent(inflated);
    }

    _parseGraphModel(model) {
        // Extract page dimensions from model attributes
        const pageWidth = parseFloat(model.getAttribute('pageWidth')) || 800;
        const pageHeight = parseFloat(model.getAttribute('pageHeight')) || 600;

        const root = model.querySelector('root');
        if (!root) {
            throw new Error('No <root> element in mxGraphModel');
        }

        // Collect all cells (both mxCell and object>mxCell)
        const cells = [];
        for (const child of root.children) {
            if (child.tagName === 'mxCell') {
                cells.push({ cell: child, label: child.getAttribute('value') || '' });
            } else if (child.tagName === 'object' || child.tagName === 'UserObject') {
                const innerCell = child.querySelector('mxCell');
                if (innerCell) {
                    cells.push({ cell: innerCell, label: child.getAttribute('label') || '' });
                }
            }
        }

        // First pass: parse all vertices (shapes)
        for (const { cell, label } of cells) {
            if (cell.getAttribute('vertex') === '1') {
                this._parseVertex(cell, label);
            }
        }

        // Compute bounding box for viewBox
        this._computeViewBox(pageWidth, pageHeight);

        // Second pass: parse all edges (connectors)
        for (const { cell, label } of cells) {
            if (cell.getAttribute('edge') === '1') {
                this._parseEdge(cell, label);
            }
        }
    }

    _parseVertex(cell, label) {
        const geom = cell.querySelector('mxGeometry');
        if (!geom) return;

        const x = parseFloat(geom.getAttribute('x')) || 0;
        const y = parseFloat(geom.getAttribute('y')) || 0;
        const w = parseFloat(geom.getAttribute('width')) || 100;
        const h = parseFloat(geom.getAttribute('height')) || 60;

        const styleStr = cell.getAttribute('style') || '';
        const style = this._parseStyle(styleStr);

        // Determine shape type from style
        let type = 'rect';
        const shapeName = style['shape'] || '';

        if (shapeName === 'ellipse' || styleStr.includes('ellipse')) {
            type = 'ellipse';
        } else if (shapeName === 'rhombus' || styleStr.includes('rhombus')) {
            type = 'diamond';
        } else if (shapeName === 'triangle' || styleStr.includes('triangle')) {
            type = 'polygon';
        } else if (shapeName === 'hexagon' || styleStr.includes('hexagon')) {
            type = 'polygon';
        } else if (shapeName === 'cylinder' || shapeName === 'cylinder3') {
            type = 'rect'; // approximate as rect
        } else if (shapeName === 'parallelogram') {
            type = 'polygon';
        }

        // Strip HTML from label
        const text = this._stripHtml(label);

        // Build style object matching SvgParser format
        const fillColor = style['fillColor'] || '#FFFFFF';
        const strokeColor = style['strokeColor'] || '#000000';
        const strokeWidth = parseFloat(style['strokeWidth']) || 1;
        const opacity = parseFloat(style['opacity']) || 100;
        const rounded = style['rounded'] === '1';
        const dashed = style['dashed'] === '1';

        const shapeObj = {
            type: type,
            x: x,
            y: y,
            width: w,
            height: h,
            style: {
                fill: fillColor === 'none' ? 'none' : fillColor,
                stroke: strokeColor === 'none' ? 'none' : strokeColor,
                strokeWidth: strokeWidth,
                strokeDasharray: dashed ? '5,5' : null,
                opacity: opacity / 100,
                fillOpacity: 1,
                rx: rounded ? Math.min(w, h) * 0.1 : 0
            },
            text: text || null,
            textStyle: null
        };

        if (text) {
            const fontSize = parseFloat(style['fontSize']) || 12;
            const fontColor = style['fontColor'] || '#000000';
            const fontStyleVal = parseInt(style['fontStyle']) || 0;

            shapeObj.textStyle = {
                fontSize: fontSize,
                textColor: fontColor,
                fontWeight: (fontStyleVal & 1) ? 'bold' : 'normal'
            };
        }

        // Handle polygon points for specific shapes
        if (type === 'polygon' && shapeName === 'triangle') {
            shapeObj.points = [
                { x: x + w / 2, y: y },
                { x: x + w, y: y + h },
                { x: x, y: y + h }
            ];
        } else if (type === 'polygon' && shapeName === 'hexagon') {
            const inset = w * 0.25;
            shapeObj.points = [
                { x: x + inset, y: y },
                { x: x + w - inset, y: y },
                { x: x + w, y: y + h / 2 },
                { x: x + w - inset, y: y + h },
                { x: x + inset, y: y + h },
                { x: x, y: y + h / 2 }
            ];
        } else if (type === 'polygon' && shapeName === 'parallelogram') {
            const inset = w * 0.2;
            shapeObj.points = [
                { x: x + inset, y: y },
                { x: x + w, y: y },
                { x: x + w - inset, y: y + h },
                { x: x, y: y + h }
            ];
        }

        const cellId = cell.getAttribute('id');
        this.cellIdToShapeIndex[cellId] = this.shapes.length;
        this.shapes.push(shapeObj);
    }

    _parseEdge(cell, label) {
        const styleStr = cell.getAttribute('style') || '';
        const style = this._parseStyle(styleStr);

        const sourceId = cell.getAttribute('source');
        const targetId = cell.getAttribute('target');

        // Determine connection points
        const points = this._getEdgePoints(cell, sourceId, targetId);
        if (points.length < 2) return;

        const strokeColor = style['strokeColor'] || '#000000';
        const strokeWidth = parseFloat(style['strokeWidth']) || 1;
        const dashed = style['dashed'] === '1';

        // Detect arrows
        const endArrow = style['endArrow'] || 'classic';
        const startArrow = style['startArrow'] || 'none';
        const hasArrow = endArrow !== 'none' && endArrow !== '0';

        const fromShape = sourceId != null ? (this.cellIdToShapeIndex[sourceId] ?? null) : null;
        const toShape = targetId != null ? (this.cellIdToShapeIndex[targetId] ?? null) : null;

        this.connectors.push({
            type: 'line',
            points: points,
            hasArrow: hasArrow,
            style: {
                stroke: strokeColor,
                strokeWidth: strokeWidth,
                strokeDasharray: dashed ? '5,5' : null,
                opacity: 1
            },
            fromShape: fromShape,
            toShape: toShape
        });

        // If edge has a label, add as standalone text at midpoint
        const text = this._stripHtml(label);
        if (text) {
            const midIdx = Math.floor(points.length / 2);
            const midPt = points[midIdx];
            this.texts.push({
                x: midPt.x,
                y: midPt.y,
                text: text,
                style: {
                    fontSize: parseFloat(style['fontSize']) || 11,
                    textColor: style['fontColor'] || '#000000',
                    fontWeight: 'normal',
                    fill: 'none'
                }
            });
        }
    }

    _getEdgePoints(cell, sourceId, targetId) {
        const points = [];
        const geom = cell.querySelector('mxGeometry');

        // Source point
        if (sourceId && this.cellIdToShapeIndex[sourceId] !== undefined) {
            const shape = this.shapes[this.cellIdToShapeIndex[sourceId]];
            points.push({ x: shape.x + shape.width / 2, y: shape.y + shape.height / 2 });
        } else if (geom) {
            const srcPt = geom.querySelector('mxPoint[as="sourcePoint"]');
            if (srcPt) {
                points.push({
                    x: parseFloat(srcPt.getAttribute('x')) || 0,
                    y: parseFloat(srcPt.getAttribute('y')) || 0
                });
            }
        }

        // Intermediate waypoints
        if (geom) {
            const waypoints = geom.querySelector('Array[as="points"]');
            if (waypoints) {
                for (const pt of waypoints.querySelectorAll('mxPoint')) {
                    points.push({
                        x: parseFloat(pt.getAttribute('x')) || 0,
                        y: parseFloat(pt.getAttribute('y')) || 0
                    });
                }
            }
        }

        // Target point
        if (targetId && this.cellIdToShapeIndex[targetId] !== undefined) {
            const shape = this.shapes[this.cellIdToShapeIndex[targetId]];
            points.push({ x: shape.x + shape.width / 2, y: shape.y + shape.height / 2 });
        } else if (geom) {
            const tgtPt = geom.querySelector('mxPoint[as="targetPoint"]');
            if (tgtPt) {
                points.push({
                    x: parseFloat(tgtPt.getAttribute('x')) || 0,
                    y: parseFloat(tgtPt.getAttribute('y')) || 0
                });
            }
        }

        return points;
    }

    _computeViewBox(defaultWidth, defaultHeight) {
        if (this.shapes.length === 0) {
            this.viewBox = { x: 0, y: 0, width: defaultWidth, height: defaultHeight };
            return;
        }

        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const s of this.shapes) {
            minX = Math.min(minX, s.x);
            minY = Math.min(minY, s.y);
            maxX = Math.max(maxX, s.x + s.width);
            maxY = Math.max(maxY, s.y + s.height);
        }

        // Add padding
        const pad = 40;
        this.viewBox = {
            x: 0,
            y: 0,
            width: Math.max(maxX + pad, defaultWidth),
            height: Math.max(maxY + pad, defaultHeight)
        };
    }

    _parseStyle(styleStr) {
        const result = {};
        if (!styleStr) return result;

        const parts = styleStr.split(';');
        for (const part of parts) {
            const eq = part.indexOf('=');
            if (eq > 0) {
                const key = part.substring(0, eq).trim();
                const val = part.substring(eq + 1).trim();
                result[key] = val;
            }
        }
        return result;
    }

    _stripHtml(str) {
        if (!str) return '';
        // Remove HTML tags and decode entities
        return str
            .replace(/<br\s*\/?>/gi, '\n')
            .replace(/<[^>]+>/g, '')
            .replace(/&amp;/g, '&')
            .replace(/&lt;/g, '<')
            .replace(/&gt;/g, '>')
            .replace(/&quot;/g, '"')
            .replace(/&#39;/g, "'")
            .replace(/&nbsp;/g, ' ')
            .trim();
    }
}

/**
 * VSDX Builder - Generates Visio .vsdx files from parsed SVG data.
 *
 * VSDX is a ZIP-based Open Packaging Convention (OPC) format containing:
 * - [Content_Types].xml  - MIME types for package parts
 * - _rels/.rels          - Root relationships
 * - visio/document.xml   - Document properties
 * - visio/pages/pages.xml - Page index
 * - visio/pages/page1.xml - Page content (shapes)
 * - docProps/app.xml     - Application properties
 *
 * Coordinates: Visio uses inches with origin at bottom-left.
 * SVG uses pixels with origin at top-left.
 *
 * Uses the official Cell N="..." V="..." attribute format per MS-VSDX spec.
 * Connectors use <Connects> elements to glue to source/target shapes.
 */

class VsdxBuilder {
    constructor(parsedSvg) {
        this.data = parsedSvg;
        this.shapeIdCounter = 1;
        this.pageWidthInches = this.data.viewBox.width / 96;
        this.pageHeightInches = this.data.viewBox.height / 96;

        // Ensure minimum page size
        if (this.pageWidthInches < 1) this.pageWidthInches = 8.5;
        if (this.pageHeightInches < 1) this.pageHeightInches = 11;

        this.scale = 1 / 96; // px to inches

        // Track shape IDs for connector gluing
        this.shapeIds = []; // index = data.shapes index, value = Visio shape ID
        this.connectorLinks = []; // { connectorId, fromShapeId, toShapeId }
    }

    async build() {
        const zip = new JSZip();

        // Add required VSDX structure
        zip.file('[Content_Types].xml', this._contentTypes());
        zip.file('_rels/.rels', this._rootRels());
        zip.file('visio/document.xml', this._document());
        zip.file('visio/_rels/document.xml.rels', this._documentRels());
        zip.file('visio/pages/pages.xml', this._pages());
        zip.file('visio/pages/_rels/pages.xml.rels', this._pagesRels());
        zip.file('visio/pages/page1.xml', this._page1());
        zip.file('docProps/app.xml', this._appProps());
        zip.file('docProps/core.xml', this._coreProps());
        zip.file('visio/windows.xml', this._windows());

        const blob = await zip.generateAsync({
            type: 'blob',
            mimeType: 'application/vnd.ms-visio.drawing',
            compression: 'DEFLATE',
            compressionOptions: { level: 6 }
        });

        return blob;
    }

    _nextId() {
        return this.shapeIdCounter++;
    }

    // Convert SVG Y (top-down) to Visio Y (bottom-up) in inches
    _svgToVisioY(svgY) {
        return this.pageHeightInches - (svgY * this.scale);
    }

            const r = parseInt(rgbMatch[1]).toString(16).padStart(2, '0');
            const g = parseInt(rgbMatch[2]).toString(16).padStart(2, '0');
            const b = parseInt(rgbMatch[3]).toString(16).padStart(2, '0');
            return '#' + r + g + b;
        }

        // Already hex
        if (color.startsWith('#')) {
            if (color.length === 4) {
                return '#' + color[1] + color[1] + color[2] + color[2] + color[3] + color[3];
            }
            return color.toUpperCase();
        }

        return '#000000';
    }

    _xmlEscape(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&apos;');
    }

    _contentTypes() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>

  <Override PartName="/visio/windows.xml" ContentType="application/vnd.ms-visio.windows+xml"/>

    _rootRels() {

<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/document" Target="visio/document.xml"/>

  <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>

    _document() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<VisioDocument xmlns="http://schemas.microsoft.com/office/visio/2012/main"
               xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
               xml:space="preserve">
  <DocumentSettings TopPage="0" DefaultTextStyle="0" DefaultLineStyle="0" DefaultFillStyle="0">
    <GlueSettings>9</GlueSettings>

  </DocumentSettings>
  <FaceNames>
    <FaceName ID="1" Name="Calibri" UnicodeRanges="-536870145 1073786111 0 0" CharSets="536871327 0" Panos="2 15 5 2 2 2 4 3 2 4"/>
    <FaceName ID="2" Name="Arial" UnicodeRanges="-536870145 1073786111 0 0" CharSets="536871327 0" Panos="2 11 6 4 2 2 2 2 2 4"/>
  </FaceNames>
  <StyleSheets>
    <StyleSheet ID="0" Name="No Style" NameU="No Style">

      <Section N="Character">

    _documentRels() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/pages" Target="pages/pages.xml"/>
  <Relationship Id="rId2" Type="http://schemas.microsoft.com/visio/2010/relationships/windows" Target="windows.xml"/>
</Relationships>`;
    }

    _pages() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Pages xmlns="http://schemas.microsoft.com/office/visio/2012/main"
       xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <Page ID="0" Name="Page-1" NameU="Page-1">
    <PageSheet>
      <Cell N="PageWidth" V="${this.pageWidthInches}"/>
      <Cell N="PageHeight" V="${this.pageHeightInches}"/>
      <Cell N="PageScale" V="1"/>
      <Cell N="DrawingScale" V="1"/>
      <Cell N="DrawingSizeType" V="1"/>
      <Cell N="DrawingScaleType" V="0"/>
    </PageSheet>
    <Rel r:id="rId1"/>
  </Page>

    }

    _pagesRels() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.microsoft.com/visio/2010/relationships/page" Target="page1.xml"/>
</Relationships>`;
    }

    _appProps() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties">
  <Application>SVG to Visio Converter</Application>
  <AppVersion>15.00</AppVersion>
</Properties>`;
    }

    _coreProps() {
        const now = new Date().toISOString();
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties"
                   xmlns:dc="http://purl.org/dc/elements/1.1/"
                   xmlns:dcterms="http://purl.org/dc/terms/"
                   xmlns:dcmitype="http://purl.org/dc/dcmitype/"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <dc:creator>SVG to Visio Converter</dc:creator>
  <dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created>
  <dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified>
</cp:coreProperties>`;
    }

    _windows() {
        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Windows xmlns="http://schemas.microsoft.com/office/visio/2012/main"
         xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <Window ID="0" WindowType="Drawing" WindowState="1073741824"
          WindowLeft="-1" WindowTop="-1" WindowWidth="1024" WindowHeight="768"
          Page="0">
    <ShowGrid>0</ShowGrid>
    <ShowGuides>0</ShowGuides>
    <ShowConnectionPoints>0</ShowConnectionPoints>
    <ShowPageBreaks>0</ShowPageBreaks>
    <TabSplitterPos>0.5</TabSplitterPos>
  </Window>
</Windows>`;
    }

    _page1() {
        let shapesXml = '';
        this.shapeIds = [];
        this.connectorLinks = [];

        // Render shapes first (so we have their IDs for connectors)
        for (let i = 0; i < this.data.shapes.length; i++) {
            const shape = this.data.shapes[i];
            const id = this._nextId();
            this.shapeIds[i] = id;
            shapesXml += this._buildShape(shape, id);
        }

        // Render standalone texts
        for (const text of this.data.texts) {
            shapesXml += this._buildTextShape(text);
        }

        // Render connectors
        for (const conn of this.data.connectors) {
            const id = this._nextId();
            shapesXml += this._buildConnector(conn, id);

            // Track connections for <Connects> section
            if (conn.fromShape !== null) {
                this.connectorLinks.push({
                    connectorId: id,
                    cell: 'BeginX',
                    fromPart: 9,
                    targetId: this.shapeIds[conn.fromShape],
                    toPart: 3
                });
            }
            if (conn.toShape !== null) {
                this.connectorLinks.push({
                    connectorId: id,
                    cell: 'EndX',
                    fromPart: 12,
                    targetId: this.shapeIds[conn.toShape],
                    toPart: 3
                });
            }
        }

        // Build <Connects> section
        let connectsXml = '';
        if (this.connectorLinks.length > 0) {
            connectsXml = '\n  <Connects>';
            for (const link of this.connectorLinks) {
                connectsXml += `\n    <Connect FromSheet="${link.connectorId}" FromCell="${link.cell}" FromPart="${link.fromPart}" ToSheet="${link.targetId}" ToCell="PinX" ToPart="${link.toPart}"/>`;
            }
            connectsXml += '\n  </Connects>';
        }

        return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<PageContents xmlns="http://schemas.microsoft.com/office/visio/2012/main"
              xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
              xml:space="preserve">
  <Shapes>
${shapesXml}
  </Shapes>${connectsXml}
</PageContents>`;
    }

    _buildShape(shape, id) {
        // Center position in Visio coordinates (inches, bottom-left origin)
        const w = shape.width * this.scale;
        const h = shape.height * this.scale;
        const pinX = this._svgToVisioX(shape.x) + w / 2;
        const pinY = this._svgToVisioY(shape.y + shape.height) + h / 2;

        const fillColor = this._colorToRGB(shape.style.fill);
        const lineColor = this._colorToRGB(shape.style.stroke);
        const lineWeight = (shape.style.strokeWidth || 1) * this.scale;

        let cellsXml = '';
        let sectionsXml = '';
        let textXml = '';

        // XForm cells
        cellsXml += `      <Cell N="PinX" V="${pinX}"/>
      <Cell N="PinY" V="${pinY}"/>
      <Cell N="Width" V="${w}"/>
      <Cell N="Height" V="${h}"/>
      <Cell N="LocPinX" V="${w / 2}"/>
      <Cell N="LocPinY" V="${h / 2}"/>
      <Cell N="Angle" V="0"/>
`;

        // Fill cells
        if (fillColor && shape.style.fill !== 'none') {
            const trans = 1 - (shape.style.fillOpacity || 1) * (shape.style.opacity || 1);
            cellsXml += `      <Cell N="FillForegnd" V="${fillColor}"/>
      <Cell N="FillPattern" V="1"/>
      <Cell N="FillForegndTrans" V="${trans}"/>
`;
        } else {
            cellsXml += `      <Cell N="FillPattern" V="0"/>
`;
        }

        // Line cells
        if (lineColor && shape.style.stroke !== 'none') {
            const dashPattern = shape.style.strokeDasharray ? '2' : '1';
            cellsXml += `      <Cell N="LineWeight" V="${lineWeight}"/>
      <Cell N="LineColor" V="${lineColor}"/>
      <Cell N="LinePattern" V="${dashPattern}"/>
`;
        } else {
            cellsXml += `      <Cell N="LinePattern" V="0"/>
`;
        }

        // Rounding for rects
        if (shape.type === 'rect' && shape.style.rx > 0) {
            cellsXml += `      <Cell N="Rounding" V="${shape.style.rx * this.scale}"/>
`;
        }

        // Geometry section
        switch (shape.type) {
            case 'rect':
                sectionsXml += this._rectGeom(w, h, shape.style.rx * this.scale);
                break;
            case 'circle':
            case 'ellipse':
                sectionsXml += this._ellipseGeom(w, h);
                break;
            case 'diamond':
                sectionsXml += this._diamondGeom(w, h);
                break;
            case 'polygon':
            case 'path-shape':
                sectionsXml += this._polygonGeom(shape, w, h);
                break;
            default:
                sectionsXml += this._rectGeom(w, h, 0);
        }

        // Text + character formatting
        if (shape.text) {
            const textColor = (shape.textStyle && shape.textStyle.textColor) ?
                this._colorToRGB(shape.textStyle.textColor) : '#000000';
            const fontSize = ((shape.textStyle && shape.textStyle.fontSize) || 14) / 72;
            const isBold = (shape.textStyle && shape.textStyle.fontWeight === 'bold');

            sectionsXml += `
      <Section N="Character">
        <Row IX="0">
          <Cell N="Font" V="1"/>
          <Cell N="Color" V="${textColor || '#000000'}"/>
          <Cell N="Size" V="${fontSize}"/>
          <Cell N="Style" V="${isBold ? '1' : '0'}"/>
        </Row>
      </Section>
      <Section N="Paragraph">
        <Row IX="0">
          <Cell N="HorzAlign" V="1"/>
        </Row>
      </Section>`;

            textXml = `
      <Text>${this._xmlEscape(shape.text)}</Text>`;
        }

        return `    <Shape ID="${id}" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">
${cellsXml}${sectionsXml}${textXml}
    </Shape>
`;
    }

    _rectGeom(w, h, rx) {
        if (rx > 0) {
            return `
      <Section N="Geometry" IX="0">
        <Cell N="NoFill" V="0"/>
        <Cell N="NoLine" V="0"/>
        <Row T="MoveTo" IX="1"><Cell N="X" V="0"/><Cell N="Y" V="${rx}"/></Row>
        <Row T="ArcTo" IX="2"><Cell N="X" V="${rx}"/><Cell N="Y" V="0"/><Cell N="A" V="${rx * 0.4142}"/></Row>
        <Row T="LineTo" IX="3"><Cell N="X" V="${w - rx}"/><Cell N="Y" V="0"/></Row>
        <Row T="ArcTo" IX="4"><Cell N="X" V="${w}"/><Cell N="Y" V="${rx}"/><Cell N="A" V="${rx * 0.4142}"/></Row>
        <Row T="LineTo" IX="5"><Cell N="X" V="${w}"/><Cell N="Y" V="${h - rx}"/></Row>
        <Row T="ArcTo" IX="6"><Cell N="X" V="${w - rx}"/><Cell N="Y" V="${h}"/><Cell N="A" V="${rx * 0.4142}"/></Row>
        <Row T="LineTo" IX="7"><Cell N="X" V="${rx}"/><Cell N="Y" V="${h}"/></Row>
        <Row T="ArcTo" IX="8"><Cell N="X" V="0"/><Cell N="Y" V="${h - rx}"/><Cell N="A" V="${rx * 0.4142}"/></Row>
        <Row T="LineTo" IX="9"><Cell N="X" V="0"/><Cell N="Y" V="${rx}"/></Row>
      </Section>`;
        }

        return `
      <Section N="Geometry" IX="0">
        <Cell N="NoFill" V="0"/>
        <Cell N="NoLine" V="0"/>
        <Row T="RelMoveTo" IX="1"><Cell N="X" V="0"/><Cell N="Y" V="0"/></Row>
        <Row T="RelLineTo" IX="2"><Cell N="X" V="1"/><Cell N="Y" V="0"/></Row>
        <Row T="RelLineTo" IX="3"><Cell N="X" V="1"/><Cell N="Y" V="1"/></Row>
        <Row T="RelLineTo" IX="4"><Cell N="X" V="0"/><Cell N="Y" V="1"/></Row>
        <Row T="RelLineTo" IX="5"><Cell N="X" V="0"/><Cell N="Y" V="0"/></Row>
      </Section>`;
    }

    _ellipseGeom(w, h) {
        return `
      <Section N="Geometry" IX="0">
        <Cell N="NoFill" V="0"/>
        <Cell N="NoLine" V="0"/>
        <Row T="Ellipse" IX="1">
          <Cell N="X" V="${w / 2}"/><Cell N="Y" V="${h / 2}"/>
          <Cell N="A" V="${w}"/><Cell N="B" V="${h / 2}"/>
          <Cell N="C" V="${w / 2}"/><Cell N="D" V="${h}"/>
        </Row>
      </Section>`;
    }

    _diamondGeom(w, h) {
        return `
      <Section N="Geometry" IX="0">
        <Cell N="NoFill" V="0"/>
        <Cell N="NoLine" V="0"/>
        <Row T="RelMoveTo" IX="1"><Cell N="X" V="0.5"/><Cell N="Y" V="0"/></Row>
        <Row T="RelLineTo" IX="2"><Cell N="X" V="1"/><Cell N="Y" V="0.5"/></Row>
        <Row T="RelLineTo" IX="3"><Cell N="X" V="0.5"/><Cell N="Y" V="1"/></Row>
        <Row T="RelLineTo" IX="4"><Cell N="X" V="0"/><Cell N="Y" V="0.5"/></Row>
        <Row T="RelLineTo" IX="5"><Cell N="X" V="0.5"/><Cell N="Y" V="0"/></Row>
      </Section>`;
    }

    _polygonGeom(shape, w, h) {
        if (!shape.points || shape.points.length < 3) {
            return this._rectGeom(w, h, 0);
        }

        let xml = `
      <Section N="Geometry" IX="0">
        <Cell N="NoFill" V="0"/>
        <Cell N="NoLine" V="0"/>`;

        const pts = shape.points;
        for (let i = 0; i < pts.length; i++) {
            const lx = (pts[i].x - shape.x) * this.scale;
            // Flip Y for Visio local coords
            const ly = h - (pts[i].y - shape.y) * this.scale;

            if (i === 0) {
                xml += `
        <Row T="MoveTo" IX="1"><Cell N="X" V="${lx}"/><Cell N="Y" V="${ly}"/></Row>`;
            } else {
                xml += `
        <Row T="LineTo" IX="${i + 1}"><Cell N="X" V="${lx}"/><Cell N="Y" V="${ly}"/></Row>`;
            }
        }

        // Close
        const lx0 = (pts[0].x - shape.x) * this.scale;
        const ly0 = h - (pts[0].y - shape.y) * this.scale;
        xml += `
        <Row T="LineTo" IX="${pts.length + 1}"><Cell N="X" V="${lx0}"/><Cell N="Y" V="${ly0}"/></Row>`;

        xml += `
      </Section>`;

        return xml;
    }

    _buildTextShape(text) {
        const id = this._nextId();

        // Estimate text size
        const fontSize = (text.style.fontSize || 14);
        const estWidth = Math.max(text.text.length * fontSize * 0.6 * this.scale, 1);
        const estHeight = fontSize * 1.5 * this.scale;

        const pinX = this._svgToVisioX(text.x);
        const pinY = this._svgToVisioY(text.y);

        const textColor = this._colorToRGB(text.style.textColor || text.style.fill) || '#000000';
        const fontSizeInches = fontSize / 72;
        const isBold = text.style.fontWeight === 'bold';

        return `    <Shape ID="${id}" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">
      <Cell N="PinX" V="${pinX}"/>
      <Cell N="PinY" V="${pinY}"/>
      <Cell N="Width" V="${estWidth}"/>
      <Cell N="Height" V="${estHeight}"/>
      <Cell N="LocPinX" V="${estWidth / 2}"/>
      <Cell N="LocPinY" V="${estHeight / 2}"/>
      <Cell N="Angle" V="0"/>
      <Cell N="FillPattern" V="0"/>
      <Cell N="LinePattern" V="0"/>
      <Section N="Character">
        <Row IX="0">
          <Cell N="Font" V="1"/>
          <Cell N="Color" V="${textColor}"/>
          <Cell N="Size" V="${fontSizeInches}"/>
          <Cell N="Style" V="${isBold ? '1' : '0'}"/>
        </Row>
      </Section>
      <Section N="Paragraph">
        <Row IX="0">
          <Cell N="HorzAlign" V="1"/>
        </Row>
      </Section>
      <Text>${this._xmlEscape(text.text)}</Text>
    </Shape>
`;
    }

    _buildConnector(conn, id) {
        const pts = conn.points;
        if (pts.length < 2) return '';

        const startPt = pts[0];
        const endPt = pts[pts.length - 1];

        // Calculate bounding box
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const p of pts) {
            minX = Math.min(minX, p.x);
            minY = Math.min(minY, p.y);
            maxX = Math.max(maxX, p.x);
            maxY = Math.max(maxY, p.y);
        }

        const w = Math.max((maxX - minX) * this.scale, 0.01);
        const h = Math.max((maxY - minY) * this.scale, 0.01);
        const pinX = this._svgToVisioX(minX) + w / 2;
        const pinY = this._svgToVisioY(maxY) + h / 2;

        const lineColor = this._colorToRGB(conn.style.stroke) || '#000000';
        const lineWeight = (conn.style.strokeWidth || 1) * this.scale;
        const dashPattern = conn.style.strokeDasharray ? '2' : '1';

        // Arrow: 5 = filled triangle
        const endArrow = conn.hasArrow ? '5' : '0';

        // Build geometry
        let geomXml = `
      <Section N="Geometry" IX="0">
        <Cell N="NoFill" V="1"/>
        <Cell N="NoLine" V="0"/>`;

        for (let i = 0; i < pts.length; i++) {
            const lx = (pts[i].x - minX) * this.scale;
            const ly = h - (pts[i].y - minY) * this.scale;

            if (i === 0) {
                geomXml += `
        <Row T="MoveTo" IX="1"><Cell N="X" V="${lx}"/><Cell N="Y" V="${ly}"/></Row>`;
            } else {
                geomXml += `
        <Row T="LineTo" IX="${i + 1}"><Cell N="X" V="${lx}"/><Cell N="Y" V="${ly}"/></Row>`;
            }
        }

        geomXml += `
      </Section>`;

        return `    <Shape ID="${id}" Type="Shape" LineStyle="0" FillStyle="0" TextStyle="0">
      <Cell N="PinX" V="${pinX}"/>
      <Cell N="PinY" V="${pinY}"/>
      <Cell N="Width" V="${w}"/>
      <Cell N="Height" V="${h}"/>
      <Cell N="LocPinX" V="${w / 2}"/>
      <Cell N="LocPinY" V="${h / 2}"/>
      <Cell N="Angle" V="0"/>
      <Cell N="BeginX" V="${this._svgToVisioX(startPt.x)}"/>
      <Cell N="BeginY" V="${this._svgToVisioY(startPt.y)}"/>
      <Cell N="EndX" V="${this._svgToVisioX(endPt.x)}"/>
      <Cell N="EndY" V="${this._svgToVisioY(endPt.y)}"/>
      <Cell N="FillPattern" V="0"/>
      <Cell N="LineWeight" V="${lineWeight}"/>
      <Cell N="LineColor" V="${lineColor}"/>
      <Cell N="LinePattern" V="${dashPattern}"/>
      <Cell N="BeginArrow" V="0"/>
      <Cell N="EndArrow" V="${endArrow}"/>
      <Cell N="BeginArrowSize" V="2"/>
      <Cell N="EndArrowSize" V="2"/>${geomXml}
    </Shape>
`;
    }
}

</script>
    <script>/* app.js */
/**
 * App - Ties together the UI, SVG parser, and VSDX builder.
 */

(function () {
    const dropZone = document.getElementById('dropZone');
    const browseBtn = document.getElementById('browseBtn');
    const fileInput = document.getElementById('fileInput');
    const svgInput = document.getElementById('svgInput');
    const convertBtn = document.getElementById('convertBtn');
    const statusText = document.getElementById('statusText');
    const logEl = document.getElementById('log');
    const previewSection = document.getElementById('previewSection');
    const previewContainer = document.getElementById('previewContainer');
    const statsEl = document.getElementById('stats');

    let currentInput = '';
    let currentFormat = 'svg'; // 'svg' or 'drawio'

    // --- Drag and drop ---
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) loadFile(file);
    });

    browseBtn.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('click', (e) => {
        if (e.target !== browseBtn) fileInput.click();
    });

    fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) loadFile(fileInput.files[0]);
    });

    // --- Paste area ---
    svgInput.addEventListener('input', () => {
        const val = svgInput.value.trim();
        if (val && val.includes('<svg')) {
            currentInput = val;
            currentFormat = 'svg';
            convertBtn.disabled = false;
            showPreview(val);
        } else if (val && (val.includes('<mxGraphModel') || val.includes('<mxfile'))) {
            currentInput = val;
            currentFormat = 'drawio';
            convertBtn.disabled = false;
            showPreview(null);
            log('Draw.io XML detected', 'info');
        } else {
            convertBtn.disabled = !currentInput;
        }
    });

    // --- Convert button ---
    convertBtn.addEventListener('click', async () => {
        if (!currentInput) return;
        await convert(currentInput, currentFormat);
    });

    function loadFile(file) {
        const name = file.name.toLowerCase();
        const isSvg = name.endsWith('.svg') || file.type === 'image/svg+xml';
        const isDrawio = name.endsWith('.drawio') || name.endsWith('.xml');

        if (!isSvg && !isDrawio) {
            log('Please select an SVG, .drawio, or .xml file.', 'error');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const content = e.target.result;
            currentInput = content;
            svgInput.value = content;

            // Auto-detect format from content
            if (content.includes('<mxGraphModel') || content.includes('<mxfile')) {
                currentFormat = 'drawio';
                showPreview(null);
                log(`Loaded Draw.io file: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`, 'info');
            } else {
                currentFormat = 'svg';
                showPreview(content);
                log(`Loaded SVG: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`, 'info');
            }

            convertBtn.disabled = false;
        };
        reader.readAsText(file);
    }

    function showPreview(svgString) {
        previewSection.style.display = 'block';
        if (svgString) {
            previewContainer.innerHTML = svgString;
            const svg = previewContainer.querySelector('svg');
            if (svg) {
                svg.style.maxWidth = '100%';
                svg.style.height = 'auto';
            }
        } else {
            previewContainer.innerHTML = '<p style="color:#888; padding:2rem;">Draw.io XML loaded (no visual preview)</p>';
        }
    }

    async function convert(inputString, format) {
        logEl.style.display = 'block';
        logEl.innerHTML = '';
        convertBtn.disabled = true;
        statusText.textContent = 'Converting...';

        try {
            // Parse input based on format
            const isDrawio = format === 'drawio';
            log(isDrawio ? 'Parsing Draw.io XML...' : 'Parsing SVG...', 'info');

            const parser = isDrawio ? new DrawioParser(inputString) : new SvgParser(inputString);
            const parsed = parser.parse();
            const stats = parser.getStats();

            log(`Found ${stats.shapes} shapes, ${stats.connectors} connectors, ${stats.texts} standalone texts`, 'info');
            showStats(stats);

            // Build VSDX
            log('Building VSDX file...', 'info');
            const builder = new VsdxBuilder(parsed);
            const blob = await builder.build();

            log(`Generated VSDX: ${(blob.size / 1024).toFixed(1)} KB`, 'success');

            // Download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'diagram.vsdx';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            log('Download started!', 'success');
            statusText.textContent = 'Done! Check your downloads.';
        } catch (err) {
            log('Error: ' + err.message, 'error');
            statusText.textContent = 'Conversion failed.';
            console.error(err);
        } finally {
            convertBtn.disabled = false;
        }
    }

    function showStats(stats) {
        statsEl.innerHTML = `
            <div class="stat-badge">Shapes: <span>${stats.shapes}</span></div>
            <div class="stat-badge">Connectors: <span>${stats.connectors}</span></div>
            <div class="stat-badge">Texts: <span>${stats.texts}</span></div>
            <div class="stat-badge">Canvas: <span>${stats.viewBox.width} x ${stats.viewBox.height}</span></div>
        `;
    }

    function log(msg, type) {
        const line = document.createElement('div');
        line.className = type || '';
        line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
    }
})();

</script>
</body>
</html>
